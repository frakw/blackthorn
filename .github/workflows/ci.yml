name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Failures also become annotations (readable on the run page without
      # the full log).
      - name: fmt
        run: |
          cargo fmt --check || { echo "::error::cargo fmt --check failed; run cargo fmt"; exit 1; }
      - name: the web UI's script parses
        run: |
          node --check src/assets/app.js || { echo "::error::src/assets/app.js does not parse"; exit 1; }
      - name: clippy
        run: |
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
          s=${PIPESTATUS[0]}
          grep -E '(error|warning)' clippy.log | head -20 | sed 's/^/::error::/' || true
          exit $s
      - name: test
        run: |
          cargo test 2>&1 | tee test.log
          s=${PIPESTATUS[0]}
          grep -E 'panicked|^error|FAILED' test.log | head -20 | sed 's/^/::error::/' || true
          exit $s
      - name: nft accepts the generated rules
        run: |
          sudo apt-get install -y nftables
          cargo test --no-run
          sudo -E env "PATH=$PATH" cargo test -- --ignored

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: e2e
        run: |
          tests/e2e/run.sh 2>&1 | tee e2e.log
          s=${PIPESTATUS[0]}
          grep -E 'FAIL:|^error' e2e.log | head -10 | sed 's/^/::error::/' || true
          exit $s

  # The same static builds as a release, so a tag never finds them broken.
  musl:
    runs-on: ubuntu-24.04
    needs: check
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl 2>&1 | tee build.log
          s=${PIPESTATUS[0]}
          grep -E '^error|error:' build.log | head -10 | sed 's/^/::error::/' || true
          exit $s
