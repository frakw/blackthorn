[package]
name = "blackthorn"
version = "0.5.0"
edition = "2021"
description = "An isolated hub where AI coding agents keep running and work on your machines over SSH, one way only."
license = "MIT"
repository = "https://github.com/frakw/blackthorn"
readme = "README.md"
keywords = ["claude-code", "ssh", "tmux", "sandbox", "nftables"]
categories = ["command-line-utilities"]
rust-version = "1.80"

[[bin]]
name = "thorn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5.3"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hmac = "0.12.1"
humantime = "2"
libc = "0.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
subtle = "2.6.1"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
