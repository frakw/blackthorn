[package]
name = "blackthorn"
version = "0.1.0"
edition = "2021"
description = "An isolated hub that keeps Claude Code sessions running and lets each one reach only the machines you grant it, over SSH."
license = "MIT"
repository = "https://github.com/frakw/blackthorn"
readme = "README.md"
keywords = ["claude-code", "ssh", "tmux", "sandbox", "nftables"]
categories = ["command-line-utilities"]
rust-version = "1.80"

[[bin]]
name = "thorn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
